<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPRI.exe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050508;
    color: #eee;
    font-family: monospace;
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(255,255,255,.025) 1px,
        transparent 2px,
        transparent 4px
    );
    z-index: 5;
}

main {
    width: min(850px, 92%);
    margin: auto;
    padding: 35px 0;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

.status {
    color: #ff1744;
    letter-spacing: 4px;
    font-size: 12px;
    animation: blink 2s infinite;
}

.core {
    width: 100px;
    height: 100px;
    border: 2px solid #ff1744;
    border-radius: 50%;
    margin: 25px auto;
    display: grid;
    place-items: center;
    box-shadow: 0 0 25px #ff174455;
    transition: .3s;
}

.core.active {
    transform: scale(1.12);
    box-shadow: 0 0 55px #ff1744;
}

.eye {
    width: 32px;
    height: 32px;
    background: #ff1744;
    border-radius: 50%;
    box-shadow: 0 0 25px #ff1744;
}

h1 {
    font-size: 48px;
    letter-spacing: 12px;
    text-shadow: 0 0 15px #ff1744;
    margin: 0;
}

.subtitle {
    color: #ff1744;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 10px;
}

.panel {
    border: 1px solid #571020;
    background: #09090e;
    box-shadow: 0 0 20px #ff174411;
}

.panel-title {
    padding: 12px;
    border-bottom: 1px solid #571020;
    color: #ff1744;
    font-size: 11px;
    letter-spacing: 3px;
}

#terminal {
    height: 270px;
    overflow-y: auto;
    padding: 18px;
    font-size: 13px;
    line-height: 1.7;
}

.line {
    margin-bottom: 9px;
    overflow-wrap: anywhere;
}

.system {
    color: #ff1744;
}

.user {
    color: #53dfff;
}

.capri {
    color: #eee;
}

.input-area {
    display: flex;
    border-top: 1px solid #571020;
    padding: 12px;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-family: monospace;
    font-size: 15px;
}

button {
    background: #ff1744;
    color: black;
    border: none;
    padding: 12px 18px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.95);
}

.footer {
    text-align: center;
    color: #444;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 25px;
}

@keyframes blink {
    50% { opacity: .35; }
}

@media (max-width: 500px) {
    h1 { font-size: 38px; }
    #terminal { height: 250px; }
    button { padding: 10px; }
}
</style>
</head>

<body>
<main>

<header>
    <div class="status">● SYSTEM ONLINE</div>

    <div class="core" id="core">
        <div class="eye"></div>
    </div>

    <h1>CAPRI</h1>
    <div class="subtitle">EXPERIMENTAL INTELLIGENCE</div>
</header>

<section class="panel">
    <div class="panel-title">
        CAPRI TERMINAL // CONNECTION LOCAL
    </div>

    <div id="terminal">
        <div class="line system">[SYSTEM] Initializing CAPRI.exe...</div>
        <div class="line system">[SYSTEM] Interface loaded.</div>
        <div class="line capri">CAPRI: Sistema inicializado. Estou aguardando.</div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Digite um comando..."
            autocomplete="off"
        >
        <button onclick="sendMessage()">SEND</button>
    </div>
</section>

<div class="footer">
    CAPRI.EXE // VERSION 0.2
</div>

</main>

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("message");
const core = document.getElementById("core");

function addLine(text, type) {
    const line = document.createElement("div");
    line.className = "line " + type;
    line.textContent = text;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
}

function respond(message) {
    const text = message.toLowerCase();

    if (text === "help") {
        return "Comandos disponíveis: help, status, who are you, clear.";
    }

    if (text === "status") {
        return "Interface operacional. Inteligência externa ainda não conectada.";
    }

    if (text === "who are you") {
        return "Sou CAPRI, uma interface experimental de inteligência artificial.";
    }

    if (text.includes("hello") || text.includes("oi")) {
        return "Olá. Estou aguardando novas instruções.";
    }

    if (text === "clear") {
        terminal.innerHTML = "";
        return null;
    }

    return "Comando recebido. Meu mecanismo de IA ainda não está conectado.";
}

function sendMessage() {
    const message = input.value.trim();

    if (!message) return;

    addLine("> " + message, "user");
    input.value = "";

    core.classList.add("active");

    if (message.toLowerCase() === "clear") {
        respond(message);
    } else {
        const answer = respond(message);

        setTimeout(() => {
            if (answer) addLine("CAPRI: " + answer, "capri");
            core.classList.remove("active");
        }, 450);

        return;
    }

    core.classList.remove("active");
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
