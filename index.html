<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPRI.exe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050508;
    color: #e8e8e8;
    font-family: monospace;
    min-height: 100vh;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(255,255,255,0.025) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
}

.status {
    color: #ff1744;
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 35px;
    animation: blink 1.5s infinite;
}

.core {
    width: 170px;
    height: 170px;
    border: 2px solid #ff1744;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 25px #ff174455,
                inset 0 0 25px #ff174422;
    animation: pulse 3s infinite;
    margin-bottom: 35px;
}

.eye {
    width: 65px;
    height: 65px;
    background: #ff1744;
    border-radius: 50%;
    box-shadow: 0 0 35px #ff1744;
    animation: eye 4s infinite;
}

h1 {
    font-size: clamp(40px, 10vw, 75px);
    letter-spacing: 12px;
    color: white;
    text-shadow: 0 0 15px #ff1744;
    animation: glitch 4s infinite;
}

.subtitle {
    color: #ff1744;
    letter-spacing: 5px;
    font-size: 11px;
    margin-top: 12px;
}

.message {
    margin-top: 55px;
    color: #888;
    font-size: 12px;
    line-height: 2;
}

.footer {
    position: absolute;
    bottom: 20px;
    color: #444;
    font-size: 10px;
    letter-spacing: 3px;
}

@keyframes pulse {
    50% {
        transform: scale(1.08);
        box-shadow: 0 0 50px #ff174488;
    }
}

@keyframes eye {
    50% {
        transform: scale(0.65);
        border-radius: 30%;
    }
}

@keyframes blink {
    50% { opacity: 0.3; }
}

@keyframes glitch {
    0%, 95%, 100% { transform: translateX(0); }
    96% { transform: translateX(-3px); }
    97% { transform: translateX(3px); }
    98% { transform: translateX(-2px); }
}
</style>
</head>

<body>
<div class="container">

    <div class="status">● SYSTEM ONLINE</div>

    <div class="core">
        <div class="eye"></div>
    </div>

    <h1>CAPRI</h1>
    <div class="subtitle">EXPERIMENTAL INTELLIGENCE</div>

    <div class="message">
        SYSTEM INITIALIZED<br>
        WAITING FOR CONNECTION...
    </div>

    <div class="footer">
        CAPRI.EXE // VERSION 0.1
    </div>

</div>
</body>
</html>
